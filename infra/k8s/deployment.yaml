apiVersion: v1
kind: Namespace
metadata:
  name: video-analytics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: video-analytics
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: video-analytics-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: url
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: video-analytics
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gpu
  namespace: video-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-gpu
  template:
    metadata:
      labels:
        app: inference-gpu
    spec:
      containers:
      - name: inference
        image: video-analytics-inference:latest
        resources:
          limits:
            nvidia.com/gpu: 1
        env:
        - name: GPU_ENABLED
          value: "true"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: video-analytics
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
